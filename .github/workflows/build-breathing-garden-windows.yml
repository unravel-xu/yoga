name: Build Breathing Garden Windows

on:
  workflow_dispatch:
  push:
    branches: ["codex/breathing-garden-windows"]
    paths:
      - "breathing_garden_app/**"
      - "breathing_garden_td/**"
      - "interactive_app/**"
      - ".github/workflows/build-breathing-garden-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: breathing_garden_app/requirements-windows.txt
      - name: Install Windows dependencies
        run: python -m pip install -r breathing_garden_app/requirements-windows.txt
      - name: Unit tests (no camera)
        run: |
          python -m unittest discover -s breathing_garden_td/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest breathing_garden_app.test_app breathing_garden_app.test_platform interactive_app.test_permissions -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable EXE
        run: python breathing_garden_app/build_windows.py
      - name: Verify extracted release under a Unicode path
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "花园测试 用户"
          New-Item -ItemType Directory -Force $testRoot | Out-Null
          Expand-Archive dist/BreathingGarden-Windows-x64.zip $testRoot
          $installDir = Join-Path $testRoot "安装目录"
          $p = Start-Process dist/BreathingGarden-Windows-x64-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "`"/DIR=$installDir`"") -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Installer timed out" }
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $exe = Join-Path $installDir "BreathingGarden.exe"
          if ((Get-FileHash $exe).Hash -ne (Get-FileHash (Join-Path $testRoot "BreathingGarden/BreathingGarden.exe")).Hash) { throw "Installed EXE differs from ZIP" }
          $models = Join-Path $testRoot "models.json"
          $qa = Join-Path $testRoot "QA"
          $p = Start-Process $exe -ArgumentList @('--verify-models', "`"$models`"") -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Model test timed out" }
          if ($p.ExitCode -ne 0) { throw "Model process failed: $($p.ExitCode)" }
          if (-not (Get-Content $models -Raw | ConvertFrom-Json).modelsLoaded) { throw "Models not loaded" }
          $p = Start-Process $exe -ArgumentList @('--smoke-test', "`"$qa`"") -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "GUI test timed out" }
          if ($p.ExitCode -ne 0) { throw "GUI process failed: $($p.ExitCode)" }
          $report = Get-Content (Join-Path $qa "app-test.json") -Raw | ConvertFrom-Json
          if (-not $report.ok -or $report.camera_started -or $report.device_enumeration_error -or -not $report.fullscreen_chrome_hidden -or -not $report.fullscreen_exited -or $report.world.segments -le 0) { throw "GUI assertion failed: $($report | ConvertTo-Json -Depth 5)" }
          Copy-Item $qa dist/Windows-QA -Recurse
          Copy-Item $models dist/Windows-QA/models.json
          Get-Content dist/Windows-QA/app-test.json
      - name: Upload tested Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BreathingGarden-Windows-x64
          path: |
            dist/BreathingGarden-Windows-x64.zip
            dist/BreathingGarden-Windows-x64.zip.sha256
            dist/BreathingGarden-Windows-x64-Setup.exe
            dist/BreathingGarden-Windows-x64-Setup.exe.sha256
            dist/Windows-QA/
          if-no-files-found: error
          retention-days: 30
